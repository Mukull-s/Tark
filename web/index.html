<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TigerGraph × HHGOA 2026 — Agentic Fraud Investigation Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: #131b2e;
      --bg-card-hover: #1c263d;
      --border: #263352;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --accent-tg: #f97316;
      --accent-blue: #38bdf8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: white;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--success);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }
    .container {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      background: #0f172a;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .case-list {
      overflow-y: auto;
      flex: 1;
    }
    .case-card {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(38, 51, 82, 0.4);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .case-card:hover {
      background: var(--bg-card-hover);
    }
    .case-card.active {
      background: var(--bg-card);
      border-left: 3px solid var(--accent-tg);
    }
    .case-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .case-id {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .badge-fraud { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-legit { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-sar { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .case-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    /* Main Content */
    .main {
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hero-banner {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }
    .stat-val.danger { color: var(--danger); }
    .stat-val.success { color: var(--success); }
    /* Grid sections */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Belief Gauge */
    .gauge-bar-wrapper {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 9999px;
      height: 24px;
      position: relative;
      overflow: hidden;
      margin: 12px 0;
      border: 1px solid var(--border);
    }
    .gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 50%, #ef4444 100%);
      transition: width 0.4s ease;
    }
    .gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    /* Evidence Ledger */
    .ledger-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      border-left: 3px solid var(--accent-blue);
    }
    .ledger-item.exculpatory {
      border-left-color: var(--success);
    }
    .ledger-lr {
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .lr-high { background: var(--danger-bg); color: var(--danger); }
    .lr-low { background: var(--success-bg); color: var(--success); }
    /* NBA Table */
    .nba-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .nba-table th, .nba-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(38, 51, 82, 0.4);
    }
    .nba-table th {
      color: var(--text-muted);
      font-weight: 600;
    }
    .route-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    .route-auto { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); }
    .route-l1 { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .route-l2 { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    /* SAR Box */
    .sar-box {
      background: #090e1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-badge">TIGERGRAPH</span>
      <div>
        <div class="brand-title">Agentic Fraud Investigation Console</div>
        <div class="brand-subtitle">HHGOA 2026 Partner Trial · DeepSeek V4 Flash · Evidence Compass Engine</div>
      </div>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      Savanna Cloud Active · GSQL Graph Connected
    </div>
  </header>

  <div class="container">
    <!-- Sidebar Case Selector -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Benchmark Cases (20)</span>
        <span>Filter</span>
      </div>
      <div class="case-list" id="caseList">
        <!-- Injected via JS -->
      </div>
    </aside>

    <!-- Main View -->
    <main class="main" id="mainContent">
      <!-- Injected via JS -->
    </main>
  </div>

  <script>
    let casesData = [];
    let currentCase = null;

    async function init() {
      try {
        const res = await fetch('/api/cases');
        casesData = await res.json();
        renderSidebar();
        if (casesData.length > 0) {
          loadCase(casesData[0].case_id);
        }
      } catch (err) {
        console.error("Failed to load cases:", err);
      }
    }

    function renderSidebar() {
      const listEl = document.getElementById('caseList');
      listEl.innerHTML = casesData.map(c => `
        <div class="case-card ${currentCase && currentCase.case_id === c.case_id ? 'active' : ''}" onclick="loadCase('${c.case_id}')">
          <div class="case-top">
            <span class="case-id">${c.case_id}</span>
            <span class="badge ${c.verdict === 'confirmed_fraud' ? 'badge-fraud' : 'badge-legit'}">
              ${c.verdict === 'confirmed_fraud' ? 'FRAUD' : 'CLEARED'}
            </span>
          </div>
          <div class="case-meta">
            <span>$${c.exposure_usd.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
            <span>Prob: ${(c.fraud_probability * 100).toFixed(1)}%</span>
            ${c.sar_filed ? '<span class="badge badge-sar">SAR</span>' : ''}
          </div>
        </div>
      `).join('');
    }

    async function loadCase(caseId) {
      try {
        const res = await fetch(`/api/cases/${caseId}`);
        currentCase = await res.json();
        renderSidebar();
        renderMain();
      } catch (err) {
        console.error("Error loading case:", err);
      }
    }

    function renderMain() {
      if (!currentCase) return;
      const c = currentCase;
      const el = document.getElementById('mainContent');

      const probPercent = (c.case.fraud_probability * 100).toFixed(1);

      el.innerHTML = `
        <div class="hero-banner">
          <div>
            <div class="stat-label">Investigation ID</div>
            <div class="stat-val">${c.case_id}</div>
          </div>
          <div>
            <div class="stat-label">Verdict</div>
            <div class="stat-val ${c.case.verdict === 'confirmed_fraud' ? 'danger' : 'success'}">
              ${c.case.verdict === 'confirmed_fraud' ? 'Confirmed Fraud' : 'Legitimate'}
            </div>
          </div>
          <div>
            <div class="stat-label">Total Exposure</div>
            <div class="stat-val">$${c.case.exposure_usd.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
          </div>
          <div>
            <div class="stat-label">Graph Record</div>
            <div class="stat-val" style="font-family: var(--font-mono); font-size: 16px; color: var(--accent-tg);">
              ${c.case.graph_case_id}
            </div>
          </div>
        </div>

        <div class="grid-2">
          <!-- Belief Trajectory -->
          <div class="card">
            <div class="card-title">
              <span>🎯</span> Belief Trajectory & Uncertainty
            </div>
            <div class="gauge-bar-wrapper">
              <div class="gauge-fill" style="width: ${probPercent}%"></div>
            </div>
            <div class="gauge-labels">
              <span>Legitimate (0.0)</span>
              <span>P(Fraud) = ${c.case.fraud_probability.toFixed(4)}</span>
              <span>Fraud (1.0)</span>
            </div>
            <div style="margin-top: 14px; font-size: 12px; color: var(--text-muted);">
              <strong>Pattern Typology:</strong> <code>${c.case.pattern}</code><br>
              <strong>Stop Reason:</strong> <code>${c.stop_reason}</code>
            </div>
          </div>

          <!-- Evidence Compass -->
          <div class="card">
            <div class="card-title">
              <span>🧭</span> Evidence Compass (Decision-Flip Evaluator)
            </div>
            <div style="font-size: 13px; margin-bottom: 12px;">
              ${c.evidence_requests && c.evidence_requests.length > 0 
                ? `<div style="background: rgba(249, 115, 22, 0.1); border: 1px solid rgba(249, 115, 22, 0.3); padding: 10px; border-radius: 6px;">
                    <div style="color: var(--accent-tg); font-weight: 700; margin-bottom: 4px;">Evidence Requested: ${c.evidence_requests[0].type}</div>
                    <div><em>"${c.evidence_requests[0].prompt}"</em></div>
                    <div style="margin-top: 6px; font-size: 11px; color: var(--text-muted);">Response: ${c.evidence_requests[0].response}</div>
                   </div>`
                : `<div style="background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px; border-radius: 6px; color: var(--accent-blue);">
                    <strong>Action Invariant:</strong> High initial graph evidence density. Additional evidence would not alter policy recommendation.
                   </div>`
              }
            </div>
            <div style="font-size: 12px; color: var(--text-muted);">
              <strong>What Changed:</strong> ${c.next_best_actions.what_changed}
            </div>
          </div>
        </div>

        <!-- Evidence Ledger -->
        <div class="card">
          <div class="card-title">
            <span>📋</span> Evidence Ledger (Bayesian Likelihood Ratios)
          </div>
          <div>
            ${c.case.evidence.map(e => `
              <div class="ledger-item ${e.exculpatory ? 'exculpatory' : ''}">
                <div>
                  <strong>${e.type}</strong> — <span>${e.finding}</span>
                  <div style="font-size: 10px; color: var(--text-muted);">Source: ${e.source}</div>
                </div>
                <div class="ledger-lr ${e.lr > 1.0 ? 'lr-high' : 'lr-low'}">
                  LR: ${e.lr} (log-LR: ${e.log_lr > 0 ? '+' : ''}${e.log_lr})
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Next Best Actions Table -->
        <div class="card">
          <div class="card-title">
            <span>⚡</span> Next Best Actions (Policy Matrix R1–R10)
          </div>
          <table class="nba-table">
            <thead>
              <tr>
                <th>Phase</th>
                <th>Action Identifier</th>
                <th>Approval Route</th>
                <th>Justification</th>
              </tr>
            </thead>
            <tbody>
              ${c.next_best_actions.initial.map(a => `
                <tr style="opacity: 0.7;">
                  <td><span style="font-size: 10px; text-transform: uppercase; color: var(--text-muted);">Initial</span></td>
                  <td><strong>${a.action}</strong></td>
                  <td><span class="route-badge route-${a.approval_route.toLowerCase()}">${a.approval_route}</span></td>
                  <td>${a.reason}</td>
                </tr>
              `).join('')}
              ${c.next_best_actions.final.map(a => `
                <tr style="background: rgba(16, 185, 129, 0.05);">
                  <td><span style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--success);">Final</span></td>
                  <td><strong style="color: var(--text-main);">${a.action}</strong></td>
                  <td><span class="route-badge route-${a.approval_route.toLowerCase()}">${a.approval_route}</span></td>
                  <td>${a.reason}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <!-- SAR Narrative Section -->
        ${c.sar.file ? `
          <div class="card">
            <div class="card-title" style="color: var(--warning);">
              <span>📑</span> Suspicious Activity Report (FinCEN Filing Required)
            </div>
            <div class="sar-box">${c.sar.narrative}</div>
          </div>
        ` : ''}

        <!-- Tool Calls & Similar Prior Cases -->
        <div class="grid-2">
          <div class="card">
            <div class="card-title"><span>🔍</span> TigerGraph Tool Invocations</div>
            <div style="font-family: var(--font-mono); font-size: 12px; color: var(--accent-blue);">
              ${c.tool_calls.map(t => `<div>> ${t.tool}(${JSON.stringify(t.params)})</div>`).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-title"><span>📚</span> Graph Case Memory (Precedents)</div>
            <div style="font-size: 12px;">
              ${c.case.similar_prior_cases.map(sc => `<span class="badge badge-sar" style="margin-right: 6px;">${sc}</span>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
