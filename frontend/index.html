<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tark — AI Fraud Detective</title>
    <meta name="description" content="Tark: AI Fraud Detective — Minimalist Vercel/Linear dark theme fraud investigation workstation." />
    <!-- Tailwind CSS CDN Failsafe -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pitch: '#050505',
              surface: '#0F0F0F',
              borderDark: '#222222',
              crimson: '#FF3366',
              emerald: '#10B981',
              cyan: '#06B6D4'
            },
            fontFamily: {
              space: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    <!-- Fonts: Space Grotesk & JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#FFFFFF] antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
